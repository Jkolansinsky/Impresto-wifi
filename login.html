
// este va dentro de hotspot del Mikrotik
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impresto! WiFi</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ff0000;color:#fff;font-family:Montserrat,"Segoe UI",system-ui,sans-serif;text-align:center}
  a{color:#fff;font-weight:700}
</style>
</head>
<body>
<div>
  <p>Cargando promociones de Impresto!…</p>
  <p><a id="manual" href="#">Si no avanza, toca aquí</a></p>
</div>

<script>
  // >>> CAMBIAR <<<  tu usuario de GitHub y el nombre del repositorio
  var PORTAL = "https://jkolansinsky.github.io/impresto-wifi/index.html";

  // Estos valores los reemplaza el MikroTik automaticamente
  var loginUrl = "$(link-login-only)";
  var destino  = "$(link-orig)";
  var error    = "$(error)";

  var url = PORTAL +
    "?login=" + encodeURIComponent(loginUrl) +
    "&dst="   + encodeURIComponent(destino) +
    "&error=" + encodeURIComponent(error);

  document.getElementById("manual").href = url;
  window.location.replace(url);
</script>
</body>
</html>
