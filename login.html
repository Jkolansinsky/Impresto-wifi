<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conectando… | Impresto!</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ff0000;color:#fff;
       font-family:Montserrat,"Segoe UI",system-ui,sans-serif;text-align:center;padding:20px}
  h1{margin:0 0 8px;font-size:1.6rem}
  p{margin:6px 0}
  a{color:#fff;font-weight:700}
  .rueda{width:42px;height:42px;margin:0 auto 16px;border:4px solid #c40000;border-top-color:#fff;
         border-radius:50%;animation:g 1s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.rueda{animation:none}}
</style>
</head>
<body>
<div>
  <div class="rueda"></div>
  <h1>Conectando a Impresto! WiFi…</h1>
  <p>En un momento tendrás internet.</p>
  <p><a id="manual" href="#">Si no avanza, toca aquí</a></p>
</div>

<script>
var USUARIO = "cliente";
var CLAVE   = "Impresto2026";
var DESTINO_POR_DEFECTO = "https://www.google.com";

var p = new URLSearchParams(location.search);

var login = p.get("login") || "";
if (login.indexOf("http://192.168.5.1/") !== 0) login = "http://192.168.5.1/login";

var dst = p.get("dst") || "";
if (!/^https?:\/\//i.test(dst)) dst = DESTINO_POR_DEFECTO;

var url = login +
  "?username=" + encodeURIComponent(USUARIO) +
  "&password=" + encodeURIComponent(CLAVE) +
  "&dst="      + encodeURIComponent(dst);

document.getElementById("manual").href = url;
setTimeout(function () { location.replace(url); }, 600);
</script>
</body>
</html>
