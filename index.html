<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiFi Impresto! Ruiz Cortinez</title>
<style>
  /* Tipografia Montserrat: si subes fonts/Montserrat.woff2 al repo se usa; si no, cae a la del sistema */
  @font-face{font-family:Montserrat; src:url("fonts/Montserrat.woff2") format("woff2"); font-weight:100 900; font-display:swap}
  /* Colores de Impresto! */
  :root{
    --fondo:#ff0000;      /* rojo Impresto */
    --fondo2:#c40000;     /* rojo oscuro para barras y tarjetas */
    --acento:#ffffff;     /* blanco: boton y detalles */
    --texto:#ffffff;
    --suave:#ffe1e1;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh; color:var(--texto);
    background:var(--fondo);
    font-family:Montserrat,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    display:flex; justify-content:center; padding:16px;
  }
  main{width:100%; max-width:520px; display:flex; flex-direction:column; gap:14px}

  header{text-align:center}
  .logo{width:240px; max-width:70%; height:auto; display:block; margin:4px auto 6px}
  .sub{margin:0; font-size:.9rem; color:var(--suave)}

  .aviso{margin:0; padding:10px 12px; border-radius:10px; background:#7a0000; font-size:.9rem}
  .aviso[hidden]{display:none}

  .carrusel{position:relative; aspect-ratio:16/9; border-radius:14px; border:2px solid #fff; overflow:hidden; background:var(--fondo2)}
  .carrusel img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .6s}
  .carrusel img.activa{opacity:1}
  .puntos{position:absolute; left:0; right:0; bottom:8px; display:flex; justify-content:center; gap:6px}
  .puntos i{width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.5)}
  .puntos i.activo{background:var(--acento)}

  .video{position:relative; border-radius:14px; border:2px solid #fff; overflow:hidden; background:#000; aspect-ratio:16/9}
  .video video{width:100%; height:100%; display:block; object-fit:contain; background:#000}
  .play{
    position:absolute; inset:0; margin:auto; width:76px; height:76px; border:0; border-radius:50%;
    background:var(--acento); color:var(--fondo); font-size:2rem; cursor:pointer; padding-left:6px
  }
  .play[hidden]{display:none}
  .sonido{
    position:absolute; right:10px; top:10px; border:0; border-radius:999px; padding:8px 12px;
    font:inherit; font-size:.8rem; background:rgba(0,0,0,.65); color:#fff; cursor:pointer
  }
  .barra{height:6px; border-radius:3px; background:var(--fondo2); overflow:hidden}
  .barra div{height:100%; width:0; background:var(--acento); transition:width .3s linear}
  .estado{margin:0; font-size:.9rem; color:var(--suave); text-align:center}

  #conectar{
    border:0; border-radius:14px; padding:16px; font:inherit; font-size:1.1rem; font-weight:800;
    background:var(--acento); color:var(--fondo); cursor:pointer;
  }
  #conectar:disabled{background:var(--fondo2); color:var(--suave); cursor:not-allowed}
  button:focus-visible{outline:3px solid #fff; outline-offset:2px}
  footer{font-size:.75rem; color:var(--suave); text-align:center; margin:2px 0 0}
</style>
</head>

  <p class="aviso" id="aviso" hidden></p>

  <section class="carrusel" id="carrusel" aria-label="Promociones"></section>

  <section class="video">
    <video id="video" playsinline muted preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate">
      <source src="videos/promo1.mp4" type="video/mp4">
    </video>
    <button class="play" id="play" type="button" aria-label="Reproducir video">&#9654;</button>
    <button class="sonido" id="sonido" type="button">Activar sonido</button>
  </section>
  <div class="barra"><div id="progreso"></div></div>
  <p class="estado" id="estado">Mira el video completo para activar tu internet.</p>

  <button id="conectar" type="button" disabled>Conectarme a Internet</button>
  <footer>Máximo 10 dispositivos simultáneos · Sesión de 3 horas</footer>
</main>

<script>
/* ============ CONFIGURACION ============ */
var IMAGENES = ["images/promo1.jpg", "images/promo2.jpg", "images/promo3.jpg"];
// Si el video falla, el boton se activa despues de estos segundos
var SEGUNDOS_RESPALDO = 20;
/* ======================================= */

var params = new URLSearchParams(location.search);
var $ = function (id) { return document.getElementById(id); };

var err = params.get("error");
if (err) {
  $("aviso").hidden = false;
  $("aviso").textContent = /simultaneous|shared|limit/i.test(err)
    ? "Se alcanzó el máximo de 10 dispositivos conectados. Intenta más tarde."
    : "No se pudo conectar: " + err;
}

/* ---- Carrusel ---- */
var slides = IMAGENES.map(function (src, i) {
  var img = new Image();
  img.src = src; img.alt = "Promoción " + (i + 1);
  if (i === 0) img.className = "activa";
  $("carrusel").appendChild(img);
  return img;
});
var puntos = document.createElement("div");
puntos.className = "puntos";
slides.forEach(function (_, i) {
  var p = document.createElement("i");
  if (i === 0) p.className = "activo";
  puntos.appendChild(p);
});
$("carrusel").appendChild(puntos);
var actual = 0;
if (slides.length > 1) {
  setInterval(function () {
    slides[actual].classList.remove("activa");
    puntos.children[actual].classList.remove("activo");
    actual = (actual + 1) % slides.length;
    slides[actual].classList.add("activa");
    puntos.children[actual].classList.add("activo");
  }, 4000);
}

/* ---- Video + boton ---- */
var video = $("video"), boton = $("conectar"), listo = false, ultimo = 0, respaldo = false;

function habilitar() {
  if (listo) return;
  listo = true;
  boton.disabled = false;
  $("progreso").style.width = "100%";
  $("estado").textContent = "¡Listo! Toca el botón para conectarte.";
}

function fallo(motivo) {
  if (respaldo) return;
  respaldo = true;
  $("play").hidden = true;
  $("estado").textContent = motivo + " Tu botón se activará en " + SEGUNDOS_RESPALDO + " segundos.";
  setTimeout(habilitar, SEGUNDOS_RESPALDO * 1000);
}

function reproducir() {
  var p = video.play();
  if (p && p.catch) p.catch(function () { $("play").hidden = false; });
}

video.addEventListener("loadedmetadata", function () {
  // Audio sin imagen = el video esta en H.265/HEVC u otro codec no compatible
  if (video.videoWidth === 0) fallo("El video está en un formato no compatible (se necesita MP4 H.264).");
});
video.addEventListener("playing", function () { $("play").hidden = true; });
video.addEventListener("pause", function () { if (!video.ended && !respaldo) $("play").hidden = false; });
video.addEventListener("timeupdate", function () {
  if (!video.seeking) ultimo = video.currentTime;
  if (video.duration) $("progreso").style.width = (video.currentTime / video.duration * 100) + "%";
});
video.addEventListener("seeking", function () {
  if (video.currentTime > ultimo + 0.5) video.currentTime = ultimo;
});
video.addEventListener("ended", habilitar);
video.addEventListener("error", function () { fallo("No se pudo cargar el video."); });
var fuente = video.querySelector("source");
if (fuente) fuente.addEventListener("error", function () { fallo("No se pudo cargar el video."); });

$("play").addEventListener("click", reproducir);
video.addEventListener("click", function () { if (video.paused) reproducir(); });
$("sonido").addEventListener("click", function () {
  video.muted = !video.muted;
  this.textContent = video.muted ? "Activar sonido" : "Silenciar";
});
reproducir();

/* ---- Ir a login.html conservando los datos del router ---- */
boton.addEventListener("click", function () {
  var q = new URLSearchParams();
  q.set("login", params.get("login") || "");
  q.set("dst", params.get("dst") || "");
  location.href = "login.html?" + q.toString();
});
</script>
